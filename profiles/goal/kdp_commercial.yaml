# ==============================================================================
# KDP COMMERCIAL FICTION GOAL PROFILE
# ==============================================================================
# Intent: kdp_high_revenue
# Optimizes for: Kindle Unlimited borrows, KENPC page reads, sell-through rate
#
# Conflict resolution philosophy:
#   - Genre conventions > Author voice where they diverge (marketplace expectation)
#   - Goal enforces pacing and length targets over genre defaults
#   - Sensitivity always wins on hard threshold axes regardless of rules below
#
# Success criteria are evaluated at manuscript completion by the ConvergenceAgent.
# All criteria use the same metric names as the LedgerManager dashboard.
# ==============================================================================

profile_id: goal_kdp_commercial
version: "1.0"
intent: kdp_high_revenue

conflict_precedence_rules:
  # For voice/style choices, genre market expectation takes precedence over
  # author default to match reader expectations for the category.
  - axis: voice_axes
    precedence_order: [genre, audience, author, universal]

  # Pacing: Goal enforces commercial pacing targets over genre defaults.
  - axis: pacing
    precedence_order: [goal, genre, audience, universal]

  # Word count: Goal enforces length targets for KU optimization.
  - axis: word_count
    precedence_order: [goal, genre, audience, universal]

  # POV: Author voice takes priority (reader expectation is for consistency).
  - axis: pov_default
    precedence_order: [author, genre, goal, universal]

weight_overrides:
  critic_weights:
    # Convention compliance weighted high — KU readers expect trope delivery.
    convention_critic: 1.5
    # AI tell detection weighted high — genre fiction readers spot AI tells.
    ai_tell_critic: 1.5
    # Pacing critic weighted up — page-turn pacing drives KENPC reads.
    pacing_critic: 1.3
    craft_critic: 1.0
    specificity_critic: 1.0
    continuity_critic: 1.0
  reader_weights:
    # Target demo (KU subscriber) is primary signal.
    target_demo: 1.3
    genre_veteran: 1.0
    emotional_probe: 1.0

success_criteria:
  - criterion_id: convention_compliance
    metric: convention_compliance_score
    threshold: 0.90
    operator: gte
    description: >
      Required scene slots present at specified positions; reader contract
      fulfilled. Below 0.90 → manuscript fails KDP commercial threshold.

  - criterion_id: promise_resolution_rate
    metric: promise_resolution_rate
    threshold: 1.0
    operator: eq
    description: >
      Every opened promise must be resolved. Unresolved promises are the
      primary source of 1-star reviews in genre romance/thriller.

  - criterion_id: pacing_score
    metric: pacing_score
    threshold: 0.80
    operator: gte
    description: >
      Heat curve progression within expected range; scene rhythm balanced;
      no three consecutive same-type scenes.

  - criterion_id: ai_tell_density
    metric: ai_tell_density_per_1k
    threshold: 2.0
    operator: lte
    description: >
      AI tell density ceiling — commercial readers increasingly detect and
      penalize AI-pattern prose.

  - criterion_id: sensory_density_floor
    metric: sensory_density_per_1k
    threshold: 8.0
    operator: gte
    description: >
      Minimum sensory anchor density. Specificity-rich prose is the primary
      differentiator from generic AI output in commercial genre fiction.
